name: One-shot merged branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Deleting feat/central-visual-chat"
          gh api --method DELETE "repos/$REPO/git/refs/heads/feat%2Fcentral-visual-chat" || true
          echo "Deleting feat/intent-mode"
          gh api --method DELETE "repos/$REPO/git/refs/heads/feat%2Fintent-mode" || true
          echo "Deleting feat/seo-aiseo-skill"
          gh api --method DELETE "repos/$REPO/git/refs/heads/feat%2Fseo-aiseo-skill" || true
          echo "Deleting feat/video-watch"
          gh api --method DELETE "repos/$REPO/git/refs/heads/feat%2Fvideo-watch" || true
          echo "Deleting feat/visual-chat-style"
          gh api --method DELETE "repos/$REPO/git/refs/heads/feat%2Fvisual-chat-style" || true
